[project]
name = "rag2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "bharadwajareddy07", email = "v.s.bharadwajareddy@gmail.in" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.142.2",
    "groq>=1.7.0",
    "inngest>=0.5.19",
    "llama-index-core>=0.14.25",
    "llama-index-readers-file>=0.7.0",
    "openai>=3.23.0",
    "python-dotenv>=1.2.4",
    "qdrant-client>=1.19.1",
    "sentence-transformers>=6.1.0",
    "streamlit>=1.64.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
rag2 = "rag2:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
